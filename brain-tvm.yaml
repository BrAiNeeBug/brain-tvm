#giturl: "https://github.com/BrAiNeeBug"
substitutions:
  # Values are pasted as plain text. Everything is quoted for consistency.
  # Options that expect a time need the unit ("80ms"); values used inside C++ lambdas
  # (*_ms, *_s, *_min, dim_*) are bare numbers, the unit is in the name.
  device_name: "brain-tvm1"
  friendly_name: "brain-tvm1"
  localdomain: ".bk-net"
  # Touch must be active this long to count (filters spikes, e.g. from a piezo lighter)
  touch_delay: "50ms"
  # Touch trigger level: touched when the raw value drops below this (differs per device/wiring)
  touch_threshold: "1450"
  # "true" = log the raw touch values (idle vs touched) to find the right threshold, then back to "false"
  touch_setup_mode: "false"
  # Hold time in ms for the page button (short tap = next page)
  long_press_ms: "600"
  # Hold on the clock page toggles the backlight between this level (%) and the previous brightness
  dim_low: "5"
  # Clock page: weekday + date brightness (%) relative to the time digits (digits are always full brightness)
  date_bright_pct: "50"
  # BLE scan timing (window must be smaller than interval, WiFi needs the rest)
  ble_interval: "160ms"
  ble_window: "120ms"
  # A device counts as "present" this long after its last advertisement
  ble_timeout_s: "45"
  # Trackers: forget after this many seconds without advert / alert after this many minutes of presence
  tracker_timeout_s: "60"
  tracker_alert_min: "5"
  # Number of display pages (0-based index in the lambdas)
  page_count: "10"
  # Weather page: default PLZ (change it at runtime with the WeatherPLZ text entity) and country code
  weather_plz_default: "10115"
  weather_country: "DE"
  # Tea timer page (touch): hold = +step, longer hold = start/pause, longest hold = reset
  timer_step_s: "30"
  timer_max_min: "15"
  timer_start_ms: "1500"
  timer_reset_ms: "3000"
  # WiFi page: the QR code (shown on hold) hides itself again after this many seconds
  qr_show_s: "30"
  # Indoor / outdoor temperature sent to the device (TempIndoor / TempOutdoor numbers) counts as
  # valid for this many minutes; after that indoor shows "--" and outdoor falls back to the weather API
  temp_timeout_min: "30"

esphome:
  comment: BrAiNTVM_ESP32
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - output.turn_on: display_power
      - delay: 250ms
      - output.set_level:
          id: backlight
          level: !lambda 'return id(backlight_pct).state / 100.0f;'

preferences:
  flash_write_interval: 30s

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.1"

api:
  encryption:
    key: !secret brain_tvm__encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
    on_begin:
      - lambda: |-
          id(boot_notice) = 2;
      - component.update: main_display
    on_error:
      - lambda: |-
          id(boot_notice) = 0;

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password
    ap_timeout: 300s
  reboot_timeout: 0s
  power_save_mode: LIGHT
  domain: ${localdomain}

captive_portal:

debug:
  update_interval: 30s

logger:
  id: logger_id
  level: VERY_VERBOSE
  initial_level: NONE
  runtime_tag_levels: true

# Web UI with groups
web_server:
  port: 80
  version: 3
  auth:
    password: !secret webgui_password
    username: admin
    type: digest
  sorting_groups:
    - id: grp_display
      name: "Display"
      sorting_weight: 10
    - id: grp_ble
      name: "Bluetooth"
      sorting_weight: 20
    - id: grp_network
      name: "Network"
      sorting_weight: 30
    - id: grp_system
      name: "System"
      sorting_weight: 40
  ota: false
  # Show entities marked 'internal: true' in the web UI (they are hidden from API/HA)
  include_internal: true

# NTP time sync
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 1.de.pool.ntp.org
      - pool.ntp.org
    on_time_sync:
      then:
        - script.execute: weather_update

# HTTPS requests for the weather (Open-Meteo, no API key)
http_request:
  timeout: 10s
  watchdog_timeout: 15s

# WiFi QR code for the WiFi page. In secrets.yaml:
#   wifi_qr: "WIFI:T:WPA;S:MySSID;P:MyPassword;;"
# (escape \ ; , : " in SSID/password with a backslash)
qr_code:
  - id: wifi_qr
    value: !secret wifi_qr

# BLE scanner: remember every advertising device with its last-seen timestamp
esp32_ble_tracker:
  scan_parameters:
    continuous: true
    active: false
    interval: ${ble_interval}
    window: ${ble_window}
  on_ble_advertise:
    then:
      - lambda: |-
          uint64_t addr = x.address_uint64();
          uint32_t now = millis();
          id(ble_seen)[addr] = now;

          // Tracker signature: 1 = Apple Find My (AirTag etc.), 2 = Samsung SmartTag,
          // 3 = Tile, 4 = Chipolo, 5 = Google Find My Device network
          using esp32_ble_tracker::ESPBTUUID;
          uint32_t type = 0;
          for (auto &m : x.get_manufacturer_datas()) {
            if (m.uuid == ESPBTUUID::from_uint16(0x004C) && m.data.size() >= 2 &&
                m.data[0] == 0x12 && m.data[1] == 0x19)
              type = 1;
          }
          for (auto &sd : x.get_service_datas()) {
            if (sd.uuid == ESPBTUUID::from_uint16(0xFD5A))
              type = 2;
            else if (sd.uuid == ESPBTUUID::from_uint16(0xFEED) || sd.uuid == ESPBTUUID::from_uint16(0xFD84))
              type = 3;
            else if (sd.uuid == ESPBTUUID::from_uint16(0xFE65))
              type = 4;
            else if (sd.uuid == ESPBTUUID::from_uint16(0xFEAA) && sd.data.size() >= 1 &&
                     (sd.data[0] == 0x40 || sd.data[0] == 0x41))
              type = 5;
          }
          if (type == 0) {
            for (auto &u : x.get_service_uuids()) {
              if (u == ESPBTUUID::from_uint16(0xFEED))
                type = 3;
            }
          }

          if (type != 0) {
            auto it = id(trk_seen).find(addr);
            if (it == id(trk_seen).end())
              id(trk_seen)[addr] = {now, now, type};
            else
              it->second[1] = now;
          }

# Applies a display card JSON (called by the Card text entity)
script:
  - id: apply_card
    mode: restart
    parameters:
      payload: string
    then:
      - lambda: |-
          if (payload.empty())
            return;
          bool ok = json::parse_json(payload, [](JsonObject x) -> bool {
            auto size_code = [](const std::string &sz) -> int {
              if (sz == "s") return 0;
              if (sz == "m") return 1;
              if (sz == "xl") return 3;
              return 2;
            };
            static const size_t max_chars[4] = {26, 18, 12, 9};

            std::string title = x.containsKey("title") ? x["title"].as<std::string>() : std::string("");
            if (title.length() > 24)
              title.resize(24);
            id(card_title) = title;

            id(card_lines).clear();
            id(card_sizes).clear();
            for (int i = 1; i <= 8; i++) {
              char key[12];
              snprintf(key, sizeof(key), "line%d", i);
              if (!x.containsKey(key))
                continue;
              std::string text = x[key].as<std::string>();
              if (text.empty())
                continue;

              snprintf(key, sizeof(key), "size%d", i);
              int code = x.containsKey(key) ? size_code(x[key].as<std::string>()) : 2;

              if (text.length() > max_chars[code])
                text.resize(max_chars[code]);
              id(card_lines).push_back(text);
              id(card_sizes).push_back(code);
            }

            id(card_received) = true;

            if (x.containsKey("show") && x["show"].as<bool>()) {
              id(screen_page) = 2;
              id(rotate_counter) = 0;
            }

            ESP_LOGI("display_card",
                     "New display card: %s (%d lines)",
                     id(card_title).c_str(), (int) id(card_lines).size());
            return true;
          });

          // Not valid JSON: show the text as a single line instead (symptom fix)
          if (!ok) {
            std::string t = payload;
            if (t.length() > 12)
              t.resize(12);
            id(card_title) = "CARD";
            id(card_lines).clear();
            id(card_sizes).clear();
            id(card_lines).push_back(t);
            id(card_sizes).push_back(2);
            id(card_received) = true;
            id(screen_page) = 2;
            id(rotate_counter) = 0;
          }

  # Next page. Only pages listed in EnabledPages are used (touch + rotation).
  # rotate = true (auto rotation): the page must also be listed in RotatePages and the card page
  # is skipped until a card was received. Touch (rotate = false) cycles all enabled pages.
  - id: page_step
    mode: restart
    parameters:
      rotate: bool
    then:
      - lambda: |-
          // parse "1,3-5" style list (page numbers 1-${page_count})
          auto parse = [](const std::string &cfg, bool *out) {
            int cur = -1, from = -1;
            for (size_t i = 0; i <= cfg.size(); i++) {
              char c = i < cfg.size() ? cfg[i] : ',';
              if (c >= '0' && c <= '9') {
                cur = (cur < 0 ? 0 : cur * 10) + (c - '0');
              } else if (c == '-') {
                from = cur;
                cur = -1;
              } else if (c == ',' || c == ';' || c == '.') {
                if (cur >= 0) {
                  int lo = from >= 0 ? from : cur;
                  int hi = cur;
                  if (lo > hi) std::swap(lo, hi);
                  for (int pg = lo; pg <= hi; pg++)
                    if (pg >= 1 && pg <= ${page_count})
                      out[pg - 1] = true;
                }
                cur = -1;
                from = -1;
              }
            }
          };

          bool en[${page_count}] = {};
          parse(id(enabled_pages).state, en);
          if (rotate) {
            bool listed[${page_count}] = {};
            parse(id(rotate_pages).state, listed);
            for (int i = 0; i < ${page_count}; i++)
              en[i] = en[i] && listed[i];
            // Card page only once a card was received
            en[2] = en[2] && id(card_received);
          }

          for (int step = 1; step <= ${page_count}; step++) {
            int next = (id(screen_page) + step) % ${page_count};
            if (en[next]) {
              id(screen_page) = next;
              break;
            }
          }
          id(rotate_counter) = 0;

  # Weather: PLZ -> coordinates (geocoding only when the PLZ changed or nothing is stored yet),
  # then current weather + 4 day forecast
  - id: weather_update
    mode: restart
    then:
      - if:
          condition:
            lambda: 'return (id(w_lat) == 0.0f && id(w_lon) == 0.0f) || id(w_geo_dirty);'
          then:
            - http_request.get:
                url: !lambda |-
                  std::string q = id(w_plz).empty() ? id(weather_plz).state : id(w_plz);
                  std::string e;  // URL-encode (umlauts, spaces)
                  for (unsigned char c : q) {
                    if (isalnum(c) || c == '-' || c == '_' || c == '.') {
                      e += (char) c;
                    } else {
                      char b[4];
                      snprintf(b, sizeof(b), "%%%02X", c);
                      e += b;
                    }
                  }
                  return "https://geocoding-api.open-meteo.com/v1/search?count=1&language=en&countryCode=${weather_country}&name=" + e;
                capture_response: true
                max_response_buffer_size: 2048
                on_response:
                  then:
                    - lambda: |-
                        bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                          JsonArray res = root["results"];
                          if (res.isNull() || res.size() == 0) {
                            id(w_city) = "NOT FOUND";
                            return false;
                          }
                          JsonObject r = res[0];
                          id(w_lat) = r["latitude"].as<float>();
                          id(w_lon) = r["longitude"].as<float>();
                          id(w_city) = r["name"].as<std::string>();
                          id(w_geo_dirty) = false;
                          ESP_LOGI("weather", "Location: %s (%.4f, %.4f)",
                                   id(w_city).c_str(), id(w_lat), id(w_lon));
                          return true;
                        });
                        id(w_status) = "GEO " + std::to_string(response->status_code) + (ok ? " OK" : " FAIL");
                        if (!ok)
                          ESP_LOGW("weather", "Geocoding failed: %s", body.c_str());
                on_error:
                  then:
                    - lambda: 'id(w_status) = "GEO NET ERROR";'
      - if:
          condition:
            lambda: 'return id(w_lat) != 0.0f || id(w_lon) != 0.0f;'
          then:
            - http_request.get:
                url: !lambda |-
                  char u[260];
                  snprintf(u, sizeof(u),
                           "https://api.open-meteo.com/v1/forecast?latitude=%.4f&longitude=%.4f"
                           "&current=temperature_2m,weather_code"
                           "&daily=weather_code,temperature_2m_max,temperature_2m_min"
                           "&timezone=auto&forecast_days=4",
                           id(w_lat), id(w_lon));
                  return std::string(u);
                capture_response: true
                max_response_buffer_size: 3072
                on_response:
                  then:
                    - lambda: |-
                        bool ok = json::parse_json(body, [](JsonObject root) -> bool {
                          JsonObject cur = root["current"];
                          JsonObject day = root["daily"];
                          if (cur.isNull() || day.isNull())
                            return false;
                          JsonArray codes = day["weather_code"];
                          JsonArray mx = day["temperature_2m_max"];
                          JsonArray mn = day["temperature_2m_min"];
                          size_t n = codes.size();
                          if (mx.size() < n) n = mx.size();
                          if (mn.size() < n) n = mn.size();
                          id(w_dcode).clear();
                          id(w_dmax).clear();
                          id(w_dmin).clear();
                          for (size_t i = 0; i < n; i++) {
                            id(w_dcode).push_back(codes[i].as<int>());
                            id(w_dmax).push_back(mx[i].as<float>());
                            id(w_dmin).push_back(mn[i].as<float>());
                          }
                          id(w_temp) = cur["temperature_2m"].as<float>();
                          id(w_code) = cur["weather_code"].as<int>();
                          id(w_valid) = n > 0;
                          ESP_LOGI("weather", "Updated: %.1f C, code %d", id(w_temp), id(w_code));
                          return true;
                        });
                        id(w_status) = "FC " + std::to_string(response->status_code) + (ok ? " OK" : " FAIL");
                        if (!ok)
                          ESP_LOGW("weather", "Forecast failed: %s", body.c_str());
                on_error:
                  then:
                    - lambda: 'id(w_status) = "FC NET ERROR";'

# Display SPI
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

# Display power and backlight
output:
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
    id: display_power

  # Backlight with PWM, brightness is set by the Brightness number
  - platform: ledc
    pin: GPIO19
    inverted: true
    frequency: 5000Hz
    id: backlight

# Touch button
esp32_touch:
  setup_mode: ${touch_setup_mode}

# Current page and card content
# Pages: 0 = welcome, 1 = system status, 2 = card, 3 = clock, 4 = BLE scanner, 5 = light, 6 = WiFi monitor (hold = QR code), 7 = weather, 8 = moon, 9 = tea timer
globals:
  # Brightness (%) before the clock dimmer was activated, restored on the next hold
  - id: dim_prev
    type: float
    restore_value: true
    initial_value: "50"

  - id: screen_page
    type: int
    restore_value: false
    initial_value: "0"

  - id: rotate_counter
    type: int
    restore_value: false
    initial_value: "0"

  - id: card_title
    type: std::string
    restore_value: false
    initial_value: '"CARD"'

  # Card: text and size code (0 = s, 1 = m, 2 = l, 3 = xl) per line
  - id: card_lines
    type: std::vector<std::string>
    restore_value: false

  - id: card_sizes
    type: std::vector<int>
    restore_value: false

  # 0 = none, 1 = safe mode notice, 2 = OTA notice
  - id: boot_notice
    type: int
    restore_value: false
    initial_value: "0"

  - id: card_received
    type: bool
    restore_value: false
    initial_value: "false"

  # BLE: address -> last seen (millis)
  - id: ble_seen
    type: std::map<uint64_t, uint32_t>
    restore_value: false

  - id: ble_count
    type: int
    restore_value: false
    initial_value: "0"

  # Trackers: address -> {first seen, last seen, type} (millis)
  - id: trk_seen
    type: std::map<uint64_t, std::array<uint32_t, 3>>
    restore_value: false

  - id: tracker_count
    type: int
    restore_value: false
    initial_value: "0"

  # Trackers that were present longer than tracker_alert_min
  - id: tracker_alert
    type: int
    restore_value: false
    initial_value: "0"

  - id: ble_peak
    type: int
    restore_value: false
    initial_value: "0"

  # Touch handling: press timestamp and "long press already fired" flag
  - id: push_ts
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: push_long
    type: bool
    restore_value: false
    initial_value: "false"

  # Weather: location (kept in flash, geocoded from the PLZ), current values, forecast (today + 3 days)
  - id: w_lat
    type: float
    restore_value: true
    initial_value: "0"

  - id: w_lon
    type: float
    restore_value: true
    initial_value: "0"

  # PLZ was changed and still has to be geocoded
  - id: w_geo_dirty
    type: bool
    restore_value: false
    initial_value: "false"

  - id: w_plz
    type: std::string
    restore_value: false

  - id: w_city
    type: std::string
    restore_value: false

  # last weather request result (shown on the weather page while there is no data)
  - id: w_status
    type: std::string
    restore_value: false

  # millis() of the last TempIndoor / TempOutdoor value (0 = never received)
  - id: t_in_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: t_out_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # WiFi monitor: RSSI history (one sample every 2 s, 60 samples = 2 min) and QR code view (hold on the WiFi page)
  - id: w_rssi_hist
    type: std::vector<float>
    restore_value: false

  - id: wifi_qr_show
    type: bool
    restore_value: false
    initial_value: "false"

  - id: wifi_qr_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  # Tea timer: 0 = ready, 1 = running, 2 = paused, 3 = done (alarm until touched)
  - id: timer_state
    type: int
    restore_value: false
    initial_value: "0"

  - id: timer_set_s
    type: int
    restore_value: true
    initial_value: "180"

  # running: millis() at which the timer ends / paused: milliseconds left / total of the current run (progress bar)
  - id: timer_end_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: timer_rem_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: timer_total_ms
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: w_valid
    type: bool
    restore_value: false
    initial_value: "false"

  - id: w_temp
    type: float
    restore_value: false
    initial_value: "0"

  - id: w_code
    type: int
    restore_value: false
    initial_value: "3"

  - id: w_dcode
    type: std::vector<int>
    restore_value: false

  - id: w_dmax
    type: std::vector<float>
    restore_value: false

  - id: w_dmin
    type: std::vector<float>
    restore_value: false

# Fonts
font:
  - file: "gfonts://Roboto Mono"
    id: terminal_font
    size: 14

  - file: "gfonts://Roboto Mono"
    id: medium_font
    size: 20

  - file: "gfonts://Roboto Mono"
    id: value_font
    size: 30

  - file: "gfonts://Roboto Mono"
    id: clock_font
    size: 40

  # Big clock digits (HH:MM) - only the glyphs needed, saves RAM
  - file: "gfonts://Roboto Mono"
    id: clock_big_font
    size: 72
    glyphs: "0123456789:"

#############################################
##########  Entities / Web UI  ##############
#############################################

binary_sensor:
  # Short tap = next page (on release), hold = push button of the current page
  - platform: esp32_touch
    pin: GPIO32
    name: "Touch"
    id: touch_button
    threshold: ${touch_threshold}
    filters:
      - delayed_on: ${touch_delay}
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 9
    on_press:
      then:
        - lambda: |-
            id(push_ts) = millis();
            id(push_long) = false;
    on_release:
      then:
        - lambda: |-
            uint32_t held = millis() - id(push_ts);
            if ((id(screen_page) == 9 || (id(backlight_pct).state <= ${dim_low})) && id(timer_state) == 3) {
              // tea timer alarm: any touch acknowledges it
              id(timer_state) = 0;
            } else if (id(screen_page) == 9 && held >= ${long_press_ms}) {
              // tea timer: the length of the hold decides (the display shows the current stage)
              uint32_t now = millis();
              if (held >= ${timer_reset_ms}) {
                id(timer_state) = 0;
              } else if (held >= ${timer_start_ms}) {
                if (id(timer_state) == 1) {
                  int32_t left = (int32_t) (id(timer_end_ms) - now);
                  id(timer_rem_ms) = left > 0 ? left : 0;
                  id(timer_state) = 2;
                } else {
                  if (id(timer_state) == 0) {
                    id(timer_rem_ms) = id(timer_set_s) * 1000UL;
                    id(timer_total_ms) = id(timer_rem_ms);
                  }
                  id(timer_end_ms) = now + id(timer_rem_ms);
                  id(timer_state) = 1;
                }
              } else {
                if (id(timer_state) == 1) {
                  id(timer_end_ms) += ${timer_step_s} * 1000UL;
                  id(timer_total_ms) += ${timer_step_s} * 1000UL;
                } else if (id(timer_state) == 2) {
                  id(timer_rem_ms) += ${timer_step_s} * 1000UL;
                  id(timer_total_ms) += ${timer_step_s} * 1000UL;
                } else {
                  id(timer_set_s) += ${timer_step_s};
                  if (id(timer_set_s) > ${timer_max_min} * 60)
                    id(timer_set_s) = ${timer_step_s};
                }
              }
            } else if (id(push_long)) {
              // end of hold: release the page button
              id(push_light).publish_state(false);
            } else if (!(id(backlight_pct).state <= ${dim_low})) {
              // next enabled page (night mode = dimmed: clock only, no switching)
              id(page_step).execute(false);
            }
            id(rotate_counter) = 0;

  # Push button of the light page, active while the touch is held on that page
  # On as soon as a tracker was present longer than tracker_alert_min
  - platform: template
    name: "TrackerAlert"
    id: tracker_alert_sensor
    device_class: problem
    icon: "mdi:map-marker-alert"
    lambda: |-
