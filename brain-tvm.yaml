      auto now = id(sntp_time).now();
      if (!now.is_valid()) return {"NA"};
      return now.strftime("%Y-%m-%d %H:%M:%S");

  - platform: debug
    device:
      name: "DeviceInfo"
      entity_category: diagnostic
      web_server:
