text_sensor:
  - platform: wifi_info
    ip_address:
      name: "IP"
      entity_category: diagnostic
      id: wifi_ip
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 1
    ssid:
      name: "WiFiSSID"
      id: wifi_ssid_text
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 2
    bssid:
      name: "WiFiBSSID"
      id: wifi_bssid_text
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 3
    mac_address:
      name: "WiFiMAC"
      id: wifi_mac_text
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 5
    dns_address:
      name: "WiFiDNS"
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 8

  # Which trackers are around and for how long (m:ss)
  - platform: template
    name: "TrackerInfo"
    id: tracker_info_text
    update_interval: 5s
    icon: "mdi:map-marker-question"
    web_server:
      sorting_group_id: grp_ble
      sorting_weight: 7
    lambda: |-
      static const char *names[] = {"?", "FindMy", "SmartTag", "Tile", "Chipolo", "GoogleFMD"};
      std::string out;
      int n = 0;
      for (auto &kv : id(trk_seen)) {
        if (n == 4) {
          out += " ...";
          break;
        }
        uint32_t dwell = (kv.second[1] - kv.second[0]) / 1000;
        char buf[40];
        snprintf(buf, sizeof(buf), "%s%s %u:%02u", n ? ", " : "",
                 names[kv.second[2] % 6], (unsigned) (dwell / 60), (unsigned) (dwell % 60));
        out += buf;
        n++;
      }
      if (out.empty())
        return {"none"};
      return out;

  - platform: template
    name: "Uptime"
    entity_category: diagnostic
    id: uptime_text
    update_interval: 10s
    web_server:
      sorting_group_id: grp_system
