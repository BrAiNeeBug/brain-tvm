#giturl: "https://github.com/BrAiNeeBug"
substitutions:
  device_name: brain-tvm1
  friendly_name: "brain-tvm1"
  localdomain: ".bk-net"
  # Touch must be active this long to count (filters spikes, e.g. from a piezo lighter)
  touch_delay: 80ms
  # Hold time in ms for the page button (short tap = next page)
  long_press_ms: "600"
  # Hold on the clock page toggles the backlight between these two levels (%)
  dim_low: "30"
  dim_high: "100"
  # BLE scan timing (window must be smaller than interval, WiFi needs the rest)
  ble_interval: 160ms
  ble_window: 120ms
  # A device counts as "present" this long after its last advertisement
  ble_timeout_s: "45"
  # Trackers: forget after this many seconds without advert / alert after this many minutes of presence
  tracker_timeout_s: "60"
  tracker_alert_min: "5"

esphome:
  comment: BrAiNTVM_ESP32
  name: ${device_name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - output.turn_on: display_power
      - delay: 250ms
      - output.set_level:
          id: backlight
          level: !lambda 'return id(backlight_pct).state / 100.0f;'

preferences:
  flash_write_interval: 30s

esp32:
  board: esp32dev
  variant: esp32
  framework:
    type: esp-idf
    advanced:
      sram1_as_iram: true
      minimum_chip_revision: "3.1"

api:
  encryption:
    key: !secret brain_tvm__encryption_key
  reboot_timeout: 0s

ota:
  - platform: esphome
    encryption:
    on_begin:
      - lambda: |-
          id(boot_notice) = 2;
      - component.update: main_display
    on_error:
      - lambda: |-
          id(boot_notice) = 0;

wifi:
  id: wifi_component
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  ap:
    password: !secret ap_password
    ap_timeout: 300s
  reboot_timeout: 0s
  power_save_mode: LIGHT
  domain: ${localdomain}

captive_portal:

debug:
  update_interval: 30s

logger:
  id: logger_id
  level: VERY_VERBOSE
  initial_level: NONE
  runtime_tag_levels: true

# Web UI with groups
web_server:
  port: 80
  version: 3
  auth:
    password: !secret webgui_password
    username: admin
    type: digest
  sorting_groups:
    - id: grp_display
      name: "Display"
      sorting_weight: 10
    - id: grp_ble
      name: "Bluetooth"
      sorting_weight: 20
    - id: grp_network
      name: "Network"
      sorting_weight: 30
    - id: grp_system
      name: "System"
      sorting_weight: 40
  ota: false

# NTP time sync
time:
  - platform: sntp
    id: sntp_time
    timezone: Europe/Berlin
    servers:
      - 0.de.pool.ntp.org
      - 1.de.pool.ntp.org
      - pool.ntp.org

# BLE scanner: remember every advertising device with its last-seen timestamp
esp32_ble_tracker:
  scan_parameters:
    continuous: true
    active: false
    interval: ${ble_interval}
    window: ${ble_window}
  on_ble_advertise:
    then:
      - lambda: |-
          uint64_t addr = x.address_uint64();
          uint32_t now = millis();
          id(ble_seen)[addr] = now;

          // Tracker signature: 1 = Apple Find My (AirTag etc.), 2 = Samsung SmartTag,
          // 3 = Tile, 4 = Chipolo, 5 = Google Find My Device network
          using esp32_ble_tracker::ESPBTUUID;
          uint32_t type = 0;
          for (auto &m : x.get_manufacturer_datas()) {
            if (m.uuid == ESPBTUUID::from_uint16(0x004C) && m.data.size() >= 2 &&
                m.data[0] == 0x12 && m.data[1] == 0x19)
              type = 1;
          }
          for (auto &sd : x.get_service_datas()) {
            if (sd.uuid == ESPBTUUID::from_uint16(0xFD5A))
              type = 2;
            else if (sd.uuid == ESPBTUUID::from_uint16(0xFEED) || sd.uuid == ESPBTUUID::from_uint16(0xFD84))
              type = 3;
            else if (sd.uuid == ESPBTUUID::from_uint16(0xFE65))
              type = 4;
            else if (sd.uuid == ESPBTUUID::from_uint16(0xFEAA) && sd.data.size() >= 1 &&
                     (sd.data[0] == 0x40 || sd.data[0] == 0x41))
              type = 5;
          }
          if (type == 0) {
            for (auto &u : x.get_service_uuids()) {
              if (u == ESPBTUUID::from_uint16(0xFEED))
                type = 3;
            }
          }

          if (type != 0) {
            auto it = id(trk_seen).find(addr);
            if (it == id(trk_seen).end())
              id(trk_seen)[addr] = {now, now, type};
            else
              it->second[1] = now;
          }

# Applies a display card JSON (called by the Card text entity)
script:
  - id: apply_card
    mode: restart
    parameters:
      payload: string
    then:
      - lambda: |-
          if (payload.empty())
            return;
          bool ok = json::parse_json(payload, [](JsonObject x) -> bool {
            auto size_code = [](const std::string &sz) -> int {
              if (sz == "s") return 0;
              if (sz == "m") return 1;
              if (sz == "xl") return 3;
              return 2;
            };
            static const size_t max_chars[4] = {26, 18, 12, 9};

            std::string title = x.containsKey("title") ? x["title"].as<std::string>() : std::string("");
            if (title.length() > 24)
              title.resize(24);
            id(card_title) = title;

            id(card_lines).clear();
            id(card_sizes).clear();
            for (int i = 1; i <= 8; i++) {
              char key[12];
              snprintf(key, sizeof(key), "line%d", i);
              if (!x.containsKey(key))
                continue;
              std::string text = x[key].as<std::string>();
              if (text.empty())
                continue;

              snprintf(key, sizeof(key), "size%d", i);
              int code = x.containsKey(key) ? size_code(x[key].as<std::string>()) : 2;

              if (text.length() > max_chars[code])
                text.resize(max_chars[code]);
              id(card_lines).push_back(text);
              id(card_sizes).push_back(code);
            }

            id(card_received) = true;

            if (x.containsKey("show") && x["show"].as<bool>()) {
              id(screen_page) = 2;
              id(rotate_counter) = 0;
            }

            ESP_LOGI("display_card",
                     "New display card: %s (%d lines)",
                     id(card_title).c_str(), (int) id(card_lines).size());
            return true;
          });

          // Not valid JSON: show the text as a single line instead (symptom fix)
          if (!ok) {
            std::string t = payload;
            if (t.length() > 12)
              t.resize(12);
            id(card_title) = "CARD";
            id(card_lines).clear();
            id(card_sizes).clear();
            id(card_lines).push_back(t);
            id(card_sizes).push_back(2);
            id(card_received) = true;
            id(screen_page) = 2;
            id(rotate_counter) = 0;
          }

# Display SPI
spi:
  clk_pin: GPIO14
  mosi_pin: GPIO13

# Display power and backlight
output:
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true
    id: display_power

  # Backlight with PWM, brightness is set by the Brightness number
  - platform: ledc
    pin: GPIO19
    inverted: true
    frequency: 5000Hz
    id: backlight

# Touch button
esp32_touch:
  setup_mode: false

# Current page and card content
# Pages: 0 = welcome, 1 = system status, 2 = card, 3 = clock, 4 = BLE scanner, 5 = light
globals:
  - id: screen_page
    type: int
    restore_value: false
    initial_value: "0"

  - id: rotate_counter
    type: int
    restore_value: false
    initial_value: "0"

  - id: card_title
    type: std::string
    restore_value: false
    initial_value: '"CARD"'

  # Card: text and size code (0 = s, 1 = m, 2 = l, 3 = xl) per line
  - id: card_lines
    type: std::vector<std::string>
    restore_value: false

  - id: card_sizes
    type: std::vector<int>
    restore_value: false

  # 0 = none, 1 = safe mode notice, 2 = OTA notice
  - id: boot_notice
    type: int
    restore_value: false
    initial_value: "0"

  - id: card_received
    type: bool
    restore_value: false
    initial_value: "false"

  # BLE: address -> last seen (millis)
  - id: ble_seen
    type: std::map<uint64_t, uint32_t>
    restore_value: false

  - id: ble_count
    type: int
    restore_value: false
    initial_value: "0"

  # Trackers: address -> {first seen, last seen, type} (millis)
  - id: trk_seen
    type: std::map<uint64_t, std::array<uint32_t, 3>>
    restore_value: false

  - id: tracker_count
    type: int
    restore_value: false
    initial_value: "0"

  # Trackers that were present longer than tracker_alert_min
  - id: tracker_alert
    type: int
    restore_value: false
    initial_value: "0"

  - id: ble_peak
    type: int
    restore_value: false
    initial_value: "0"

  # Touch handling: press timestamp and "long press already fired" flag
  - id: push_ts
    type: uint32_t
    restore_value: false
    initial_value: "0"

  - id: push_long
    type: bool
    restore_value: false
    initial_value: "false"

# Fonts
font:
  - file: "gfonts://Roboto Mono"
    id: terminal_font
    size: 14

  - file: "gfonts://Roboto Mono"
    id: medium_font
    size: 20

  - file: "gfonts://Roboto Mono"
    id: value_font
    size: 30

  - file: "gfonts://Roboto Mono"
    id: clock_font
    size: 40

#############################################
##########  Entities / Web UI  ##############
#############################################

binary_sensor:
  # Short tap = next page (on release), hold = push button of the current page
  - platform: esp32_touch
    pin: GPIO32
    name: "NM TV Touch"
    id: touch_button
    threshold: 1450
    filters:
      - delayed_on: ${touch_delay}
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 9
    on_press:
      then:
        - lambda: |-
            id(push_ts) = millis();
            id(push_long) = false;
    on_release:
      then:
        - lambda: |-
            if (id(push_long)) {
              // end of hold: release the page button
              id(push_light).publish_state(false);
            } else {
              id(screen_page) = (id(screen_page) + 1) % 6;
            }
            id(rotate_counter) = 0;

  # Push button of the light page, active while the touch is held on that page
  # On as soon as a tracker was present longer than tracker_alert_min
  - platform: template
    name: "TrackerAlert"
    id: tracker_alert_sensor
    device_class: problem
    icon: "mdi:map-marker-alert"
    lambda: |-
      return id(tracker_alert) > 0;
    web_server:
      sorting_group_id: grp_ble
      sorting_weight: 5

  - platform: template
    name: "PushLight"
    id: push_light
    icon: "mdi:gesture-tap-button"
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 10

switch:
  - platform: template
    name: "BLEScanner"
    id: ble_scan_switch
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON
    icon: "mdi:bluetooth-audio"
    entity_category: config
    web_server:
      sorting_group_id: grp_ble
      sorting_weight: 1
    on_turn_on:
      - esp32_ble_tracker.start_scan:
          continuous: true
    on_turn_off:
      - esp32_ble_tracker.stop_scan:
      - lambda: |-
          id(ble_seen).clear();
          id(trk_seen).clear();

select:
  - platform: logger
    name: "LogLevel"
    id: log_level_select
    disabled_by_default: true
    icon: "mdi:text-box-search-outline"
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 1

  # Shows the current page and lets you switch it from the web UI / HA
  - platform: template
    name: "DisplayPage"
    id: page_select
    update_interval: 1s
    options:
      - "1 Welcome"
      - "2 Status"
      - "3 Card"
      - "4 Clock"
      - "5 BLE"
      - "6 Light"
    lambda: |-
      static const char *names[] = {"1 Welcome", "2 Status", "3 Card", "4 Clock", "5 BLE", "6 Light"};
      return std::string(names[id(screen_page) % 6]);
    set_action:
      - lambda: |-
          int p = x[0] - '1';
          if (p >= 0 && p < 6)
            id(screen_page) = p;
          id(rotate_counter) = 0;
    icon: "mdi:monitor-dashboard"
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 2

  # Language of the clock page (weekday, date, texts). Everything else stays English.
  - platform: template
    name: "ClockLanguage"
    id: clock_lang
    optimistic: true
    restore_value: true
    options:
      - "English"
      - "German"
    initial_option: "English"
    icon: "mdi:translate"
    entity_category: config
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 3

number:
  - platform: template
    name: "Brightness"
    id: backlight_pct
    optimistic: true
    restore_value: true
    initial_value: 100
    min_value: 0
    max_value: 100
    step: 1
    mode: slider
    unit_of_measurement: "%"
    icon: "mdi:brightness-6"
    set_action:
      - output.set_level:
          id: backlight
          level: !lambda 'return x / 100.0f;'
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 1

  # Seconds per page in the auto rotation, 0 = rotation off
  - platform: template
    name: "RotateInterval"
    id: rotate_seconds
    optimistic: true
    restore_value: true
    initial_value: 10
    min_value: 0
    max_value: 300
    step: 5
    mode: SLIDER
    unit_of_measurement: "s"
    icon: "mdi:timer-sand"
    entity_category: config
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 4

text:
  # Card for the card page: send the JSON as text (Web UI field or HA action text.set_value).
  # Every send replaces the whole card, max 255 chars.
  #   {"title": "Server", "line1": "CPU 12%", "size1": "xl", "line2": "RAM 45%", "size2": "l", "show": true}
  #   - title: header (max 24 chars)
  #   - line1..line8: only lines that are sent are drawn (centered vertically)
  #   - size1..size8: "s" (14px, 26 chars), "m" (20px, 18), "l" (30px, 12, default), "xl" (40px, 9)
  #   - show: true = jump to the card page, otherwise only updated
  #   - all keys optional, missing keys are cleared
  #
  # Home Assistant:
  #   action: text.set_value
  #   target:
  #     entity_id: text.brain_tvm1_card
  #   data:
  #     value: >
  #       {"title": "Server", "line1": "CPU {{ states('sensor.cpu') }}%", "size1": "xl", "show": true}
  - platform: template
    name: "Card"
    id: card_json
    mode: text
    optimistic: true
    restore_value: false
    initial_value: ""
    min_length: 0
    max_length: 255
    icon: "mdi:card-text-outline"
    set_action:
      - script.execute:
          id: apply_card
          payload: !lambda 'return x;'
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 6

  # Pages that take part in the auto rotation, e.g. "3,4" or "1-4" or "1,3-6"
  # 1 = Welcome, 2 = Status, 3 = Card, 4 = Clock, 5 = BLE, 6 = Light
  - platform: template
    name: "RotatePages"
    id: rotate_pages
    mode: text
    optimistic: true
    restore_value: true
    initial_value: "3,4"
    min_length: 0
    max_length: 16
    icon: "mdi:format-list-numbered"
    entity_category: config
    web_server:
      sorting_group_id: grp_display
      sorting_weight: 5

button:
  - platform: restart
    name: "Restart"
    device_class: restart
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:restart"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 2

  # Real safe mode restart, hidden. Used by the SafeModeRestart button below.
  - platform: safe_mode
    name: "SafeModeRestartInternal"
    id: safe_mode_btn
    internal: true

  # Shows a BOOTMODE notice first, because the display freezes in safe mode
  - platform: template
    name: "SafeModeRestart"
    entity_category: diagnostic
    disabled_by_default: true
    icon: "mdi:restart-alert"
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 3
    on_press:
      - lambda: |-
          id(boot_notice) = 1;
      - component.update: main_display
      - delay: 1s
      - button.press: safe_mode_btn

  - platform: template
    name: "ResetBLEPeak"
    icon: "mdi:counter"
    entity_category: config
    on_press:
      - lambda: |-
          id(ble_peak) = id(ble_count);
    web_server:
      sorting_group_id: grp_ble
      sorting_weight: 4

sensor:
  - platform: wifi_signal
    name: "WiFiSignal"
    id: wifi_signal_rssi
    update_interval: 15s
    entity_category: diagnostic
    icon: "mdi:wifi-strength-2"
    disabled_by_default: true
    web_server:
      sorting_group_id: grp_network
      sorting_weight: 4

  - platform: template
    name: "BLEDevices"
    id: ble_devices_sensor
    update_interval: 5s
    accuracy_decimals: 0
    state_class: measurement
    icon: "mdi:bluetooth-connect"
    lambda: |-
      return id(ble_count);
    web_server:
      sorting_group_id: grp_ble
      sorting_weight: 2

  - platform: template
    name: "TrackerCount"
    id: tracker_count_sensor
    update_interval: 5s
    accuracy_decimals: 0
    state_class: measurement
    icon: "mdi:map-marker-radius"
    lambda: |-
      return id(tracker_count);
    web_server:
      sorting_group_id: grp_ble
      sorting_weight: 6

  - platform: template
    name: "BLEPeak"
    id: ble_peak_sensor
    update_interval: 5s
    accuracy_decimals: 0
    icon: "mdi:counter"
    lambda: |-
      return id(ble_peak);
    web_server:
      sorting_group_id: grp_ble
      sorting_weight: 3

  - platform: debug
    free:
      name: "HeapFree"
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 10
    block:
      name: "HeapMaxBlock"
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 11
    loop_time:
      name: "LoopTime"
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 12
    cpu_frequency:
      name: "CPUFreq"
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 13

text_sensor:
  - platform: wifi_info
    ip_address:
      name: "NM TV IP"
      id: wifi_ip
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 1
    ssid:
      name: "WiFiSSID"
      id: wifi_ssid_text
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 2
    bssid:
      name: "WiFiBSSID"
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 3
    mac_address:
      name: "WiFiMAC"
      id: wifi_mac_text
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_network
        sorting_weight: 5

  # Which trackers are around and for how long (m:ss)
  - platform: template
    name: "TrackerInfo"
    id: tracker_info_text
    update_interval: 5s
    icon: "mdi:map-marker-question"
    web_server:
      sorting_group_id: grp_ble
      sorting_weight: 7
    lambda: |-
      static const char *names[] = {"?", "FindMy", "SmartTag", "Tile", "Chipolo", "GoogleFMD"};
      std::string out;
      int n = 0;
      for (auto &kv : id(trk_seen)) {
        if (n == 4) {
          out += " ...";
          break;
        }
        uint32_t dwell = (kv.second[1] - kv.second[0]) / 1000;
        char buf[40];
        snprintf(buf, sizeof(buf), "%s%s %u:%02u", n ? ", " : "",
                 names[kv.second[2] % 6], (unsigned) (dwell / 60), (unsigned) (dwell % 60));
        out += buf;
        n++;
      }
      if (out.empty())
        return {"none"};
      return out;

  - platform: template
    name: "NM TV Uptime"
    id: uptime_text
    update_interval: 10s
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 4
    lambda: |-
      int seconds = (int)(millis() / 1000);
      char buf[24];

      snprintf(buf, sizeof(buf), "%02d:%02d:%02d",
               seconds / 3600,
               (seconds / 60) % 60,
               seconds % 60);

      return {buf};

  - platform: template
    name: "SystemTime"
    id: system_time_text
    update_interval: 5s
    icon: "mdi:clock-outline"
    entity_category: diagnostic
    web_server:
      sorting_group_id: grp_system
      sorting_weight: 5
    lambda: |-
      auto now = id(sntp_time).now();
      if (!now.is_valid()) return {"NA"};
      return now.strftime("%Y-%m-%d %H:%M:%S");

  - platform: debug
    device:
      name: "DeviceInfo"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 20
    reset_reason:
      name: "ResetReason"
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 21

interval:
  # Drop devices not seen for ble_timeout_s, update counters, peak and tracker alert
  - interval: 1s
    then:
      - lambda: |-
          uint32_t now = millis();
          for (auto iter = id(ble_seen).begin(); iter != id(ble_seen).end();) {
            if (now - iter->second > ${ble_timeout_s} * 1000)
              iter = id(ble_seen).erase(iter);
            else
              ++iter;
          }

          int trk = 0, alert = 0;
          for (auto iter = id(trk_seen).begin(); iter != id(trk_seen).end();) {
            if (now - iter->second[1] > ${tracker_timeout_s} * 1000) {
              iter = id(trk_seen).erase(iter);
              continue;
            }
            trk++;
            if (iter->second[1] - iter->second[0] >= ${tracker_alert_min} * 60000)
              alert++;
            ++iter;
          }
          id(tracker_count) = trk;
          id(tracker_alert) = alert;
          id(ble_count) = id(ble_seen).size();
          if (id(ble_count) > id(ble_peak))
            id(ble_peak) = id(ble_count);

  # Hold detection: after long_press_ms the page button of the current page goes active
  # (clock page: toggles the dimmer instead)
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(touch_button).state || id(push_long))
            return;
          if (millis() - id(push_ts) < ${long_press_ms})
            return;
          id(push_long) = true;
          id(rotate_counter) = 0;
          if (id(screen_page) == 5)
            id(push_light).publish_state(true);
          if (id(screen_page) == 3) {
            auto call = id(backlight_pct).make_call();
            call.set_value(id(backlight_pct).state > (${dim_low} + ${dim_high}) / 2.0f ? ${dim_low} : ${dim_high});
            call.perform();
          }

  # Automatic page rotation
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(rotate_seconds).state >= 1;'
          then:
            - lambda: |-
                id(rotate_counter)++;
                if (id(rotate_counter) >= (int) id(rotate_seconds).state) {
                  id(rotate_counter) = 0;

                  // parse "1,3-5" style list (page numbers 1-6) from RotatePages
                  const std::string &cfg = id(rotate_pages).state;
                  bool enabled[6] = {false, false, false, false, false, false};
                  int cur = -1, from = -1;
                  for (size_t i = 0; i <= cfg.size(); i++) {
                    char c = i < cfg.size() ? cfg[i] : ',';
                    if (c >= '0' && c <= '9') {
                      cur = (cur < 0 ? 0 : cur * 10) + (c - '0');
                    } else if (c == '-') {
                      from = cur;
                      cur = -1;
                    } else if (c == ',' || c == ';' || c == '.') {
                      if (cur >= 0) {
                        int lo = from >= 0 ? from : cur;
                        int hi = cur;
                        if (lo > hi) std::swap(lo, hi);
                        for (int pg = lo; pg <= hi; pg++)
                          if (pg >= 1 && pg <= 6)
                            enabled[pg - 1] = true;
                      }
                      cur = -1;
                      from = -1;
                    }
                  }
                  // Card page only once a card was received
                  enabled[2] = enabled[2] && id(card_received);

                  for (int step = 1; step <= 6; step++) {
                    int next = (id(screen_page) + step) % 6;
                    if (enabled[next]) {
                      id(screen_page) = next;
                      break;
                    }
                  }
                }

# ST7789 display
display:
  - platform: mipi_spi
    id: main_display
    model: ST7789V
    cs_pin: GPIO15
    dc_pin: GPIO2
    dimensions:
      width: 240
      height: 240
      offset_width: 0
      offset_height: 0
    rotation: 0
    update_interval: 500ms
    lambda: |-
      it.fill(Color(0, 0, 0));

      // BOOT / OTA NOTICE (shown before safe mode restart and during OTA)
      if (id(boot_notice) != 0) {
        it.rectangle(4, 4, 232, 232,
                     Color(255, 160, 0));

        if (id(boot_notice) == 1) {
          it.print(120, 30, id(value_font),
                   Color(255, 160, 0),
                   TextAlign::TOP_CENTER, "BOOTMODE");

          it.print(120, 80, id(terminal_font),
                   Color(255, 160, 0),
                   TextAlign::TOP_CENTER, "SAFE MODE");

          it.line(15, 105, 225, 105, Color(120, 80, 0));

          it.print(120, 120, id(terminal_font),
                   Color(255, 200, 80),
                   TextAlign::TOP_CENTER, "WIFI + OTA ONLY");

          it.print(120, 142, id(terminal_font),
                   Color(255, 200, 80),
                   TextAlign::TOP_CENTER, "DISPLAY STAYS FROZEN");

          it.print(120, 175, id(terminal_font),
                   Color(255, 200, 80),
                   TextAlign::TOP_CENTER, "FLASH NEW FIRMWARE");

          it.print(120, 197, id(terminal_font),
                   Color(255, 200, 80),
                   TextAlign::TOP_CENTER, "OR WAIT FOR REBOOT");
        } else {
          it.print(120, 30, id(value_font),
                   Color(255, 160, 0),
                   TextAlign::TOP_CENTER, "OTA UPDATE");

          it.line(15, 105, 225, 105, Color(120, 80, 0));

          it.print(120, 125, id(terminal_font),
                   Color(255, 200, 80),
                   TextAlign::TOP_CENTER, "FLASHING...");

          it.print(120, 155, id(terminal_font),
                   Color(255, 200, 80),
                   TextAlign::TOP_CENTER, "DO NOT POWER OFF");
        }
        return;
      }

      // PAGE 0: WELCOME
      if (id(screen_page) == 0) {
        it.rectangle(4, 4, 232, 232,
                     Color(0, 180, 70));

        it.print(120, 30, id(value_font),
                 Color(0, 255, 90),
                 TextAlign::TOP_CENTER, "WELCOME");

        it.print(120, 80, id(terminal_font),
                 Color(0, 180, 70),
                 TextAlign::TOP_CENTER, "NM-TV // HA DASHBOARD");

        it.line(15, 105, 225, 105,
                Color(0, 100, 40));

        it.print(120, 130, id(medium_font),
                 Color(0, 255, 90),
                 TextAlign::TOP_CENTER, "TOUCH ME");

        it.print(120, 185, id(terminal_font),
                 Color(0, 200, 90),
                 TextAlign::TOP_CENTER, "> NEXT PAGE");
      }

      // PAGE 1: SYSTEM STATUS
      else if (id(screen_page) == 1) {
        it.print(8, 8, id(terminal_font),
                 Color(0, 255, 90), "SYSTEM STATUS");

        it.line(8, 30, 232, 30,
                Color(0, 120, 50));

        auto row = [&](int y, const char *label, std::string value) {
          if (value.length() > 18)
            value.resize(18);
          it.print(8, y, id(terminal_font),
                   Color(0, 180, 70), label);
          it.print(84, y, id(terminal_font),
                   Color(0, 255, 90), value.c_str());
        };

        row(38, "HOST", "${device_name}");
        row(56, "IP", id(wifi_ip).state);
        row(74, "SSID", id(wifi_ssid_text).state);
        char buf[24];

        if (std::isnan(id(wifi_signal_rssi).state))
          snprintf(buf, sizeof(buf), "--");
        else
          snprintf(buf, sizeof(buf), "%.0f dBm", id(wifi_signal_rssi).state);
        row(92, "SIGNAL", buf);

        row(110, "MAC", id(wifi_mac_text).state);
        row(128, "UPTIME", id(uptime_text).state);

        snprintf(buf, sizeof(buf), "%u KB free", (unsigned) (esp_get_free_heap_size() / 1024));
        row(146, "HEAP", buf);

        row(164, "ESPHOME", ESPHOME_VERSION);
        row(182, "BUILT", __DATE__);

        snprintf(buf, sizeof(buf), "%d devices", id(ble_count));
        row(200, "BLE", buf);
      }

      // PAGE 2: CARD (title + up to 8 lines, font size per line)
      else if (id(screen_page) == 2) {
        it.rectangle(4, 4, 232, 232,
                     Color(0, 180, 70));

        it.filled_rectangle(5, 5, 230, 28,
                            Color(0, 65, 30));

        it.printf(10, 11, id(terminal_font),
                  Color(0, 255, 90), "%s",
                  id(card_title).c_str());

        if (id(card_received)) {
          // line heights per size code: s, m, l, xl
          static const int heights[4] = {18, 26, 36, 46};
          const int gap = 6;
          int n = id(card_lines).size();

          // total height for vertical centering in the area below the header
          int total = 0;
          for (int i = 0; i < n; i++)
            total += heights[id(card_sizes)[i]] + (i > 0 ? gap : 0);
          int y = 34 + (194 - total) / 2;
          if (y < 36)
            y = 36;

          for (int i = 0; i < n; i++) {
            int code = id(card_sizes)[i];
            int h = heights[code];
            if (y + h > 230)
              break;

            if (i > 0) {
              it.line(15, y - gap / 2, 225, y - gap / 2, Color(0, 100, 40));
            }

            auto *font = id(terminal_font);
            if (code == 1) font = id(medium_font);
            else if (code == 2) font = id(value_font);
            else if (code == 3) font = id(clock_font);

            it.printf(120, y, font,
                      i == 0 ? Color(0, 255, 90) : Color(0, 200, 90),
                      TextAlign::TOP_CENTER, "%s",
                      id(card_lines)[i].c_str());

            y += h + gap;
          }
        } else {
          it.print(12, 75, id(terminal_font),
                   Color(0, 255, 90), "WAITING FOR DATA");

          it.print(12, 105, id(terminal_font),
                   Color(0, 180, 70), "Card text entity");
        }
      }

      // PAGE 3: CLOCK (language from the ClockLanguage select)
      else if (id(screen_page) == 3) {
        bool de = id(clock_lang).active_index().value_or(0) == 1;

        it.rectangle(4, 4, 232, 232,
                     Color(0, 180, 70));

        it.filled_rectangle(5, 5, 230, 28,
                            Color(0, 65, 30));

        it.print(10, 11, id(terminal_font),
                 Color(0, 255, 90), de ? "UHR" : "CLOCK");

        auto now = id(sntp_time).now();

        if (now.is_valid()) {
          // Weekday
          static const char *weekdays_de[] = {"", "Sonntag", "Montag", "Dienstag", "Mittwoch",
                                              "Donnerstag", "Freitag", "Samstag"};
          static const char *weekdays_en[] = {"", "Sunday", "Monday", "Tuesday", "Wednesday",
                                              "Thursday", "Friday", "Saturday"};
          it.printf(120, 62, id(value_font),
                    Color(0, 200, 90),
                    TextAlign::TOP_CENTER, "%s",
                    de ? weekdays_de[now.day_of_week] : weekdays_en[now.day_of_week]);

          // Time
          it.strftime(120, 105, id(clock_font),
                      Color(0, 255, 90),
                      TextAlign::TOP_CENTER, "%H:%M:%S", now);

          it.line(15, 165, 225, 165,
                  Color(0, 100, 40));

          // Date
          it.strftime(120, 180, id(terminal_font),
                      Color(0, 255, 90),
                      TextAlign::TOP_CENTER, de ? "%d.%m.%Y" : "%b %d, %Y", now);
        } else {
          it.print(12, 75, id(terminal_font),
                   Color(0, 255, 90), de ? "WARTE AUF NTP..." : "WAITING FOR NTP...");
        }
      }

      // PAGE 4: BLE SCANNER
      else if (id(screen_page) == 4) {
        bool trk_alert = id(tracker_alert) > 0;
        it.rectangle(4, 4, 232, 232,
                     trk_alert ? Color(255, 80, 0) : Color(0, 180, 70));

        it.filled_rectangle(5, 5, 230, 28,
                            Color(0, 65, 30));

        it.print(10, 11, id(terminal_font),
                 Color(0, 255, 90), "BLE SCANNER");

        // Live counter
        it.printf(120, 70, id(clock_font),
                  Color(0, 255, 90),
                  TextAlign::TOP_CENTER, "%d",
                  id(ble_count));

        it.print(120, 125, id(terminal_font),
                 Color(0, 200, 90),
                 TextAlign::TOP_CENTER, "DEVICES (LAST ${ble_timeout_s}s)");

        it.line(15, 165, 225, 165,
                Color(0, 100, 40));

        it.printf(120, 180, id(terminal_font),
                  Color(0, 180, 70),
                  TextAlign::TOP_CENTER, "PEAK: %d",
                  id(ble_peak));

        if (!id(ble_scan_switch).state) {
          it.print(120, 205, id(terminal_font),
                   Color(255, 160, 0),
                   TextAlign::TOP_CENTER, "SCANNER OFF");
        } else {
          it.printf(120, 205, id(terminal_font),
                    trk_alert ? Color(255, 160, 0) : Color(0, 180, 70),
                    TextAlign::TOP_CENTER,
                    trk_alert ? "! TRACKER: %d !" : "TRACKER: %d",
                    id(tracker_count));
        }
      }

      // PAGE 5: LIGHT (static)
      else {
        it.rectangle(4, 4, 232, 232,
                     Color(0, 180, 70));

        it.filled_rectangle(5, 5, 230, 28,
                            Color(0, 65, 30));

        it.print(10, 11, id(terminal_font),
                 Color(0, 255, 90), "LIGHT");

        it.print(120, 75, id(clock_font),
                 Color(0, 255, 90),
                 TextAlign::TOP_CENTER, "LIGHT");

        it.line(30, 135, 210, 135,
                Color(0, 100, 40));

        it.print(120, 150, id(medium_font),
                 Color(0, 200, 90),
                 TextAlign::TOP_CENTER, "* * *");

        it.print(120, 195, id(terminal_font),
                 Color(0, 180, 70),
                 TextAlign::TOP_CENTER, "HOLD = PUSH");
      }
    invert_colors: true
