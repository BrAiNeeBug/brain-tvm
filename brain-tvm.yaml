  #   - line1..line8: only lines that are sent are drawn (centered vertically)
  #   - size1..size8: "s" (14px, 26 chars), "m" (20px, 18), "l" (30px, 12, default), "xl" (40px, 9)
  #   - show: true = jump to the card page, otherwise only updated
  #   - all keys optional, missing keys are cleared
  #
  # Home Assistant:
  #   action: text.set_value
  #   target:
  #     entity_id: text.brain_tvm1_card
