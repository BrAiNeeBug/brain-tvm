    lambda: |-
      int seconds = (int)(millis() / 1000);
      char buf[24];

      snprintf(buf, sizeof(buf), "%02d:%02d:%02d",
               seconds / 3600,
               (seconds / 60) % 60,
               seconds % 60);

      return {buf};

  - platform: template
