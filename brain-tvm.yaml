        sorting_weight: 20
    reset_reason:
      name: "ResetReason"
      entity_category: diagnostic
      web_server:
        sorting_group_id: grp_system
        sorting_weight: 21

interval:
  # Drop devices not seen for ble_timeout_s, update counters, peak and tracker alert
  - interval: 1s
    then:
      - lambda: |-
          uint32_t now = millis();
          for (auto iter = id(ble_seen).begin(); iter != id(ble_seen).end();) {
            if (now - iter->second > ${ble_timeout_s} * 1000)
              iter = id(ble_seen).erase(iter);
            else
              ++iter;
          }

          int trk = 0, alert = 0;
          for (auto iter = id(trk_seen).begin(); iter != id(trk_seen).end();) {
            if (now - iter->second[1] > ${tracker_timeout_s} * 1000) {
              iter = id(trk_seen).erase(iter);
              continue;
            }
            trk++;
            if (iter->second[1] - iter->second[0] >= ${tracker_alert_min} * 60000)
              alert++;
            ++iter;
          }
          id(tracker_count) = trk;
          id(tracker_alert) = alert;
          id(ble_count) = id(ble_seen).size();
          if (id(ble_count) > id(ble_peak))
            id(ble_peak) = id(ble_count);

  # Display refresh: fast on the clock page (comet ring, colon fade), relaxed elsewhere
  # so the main loop stays free for touch + BLE
  - interval: 50ms
    then:
      - lambda: |-
          // night mode (clock dimmer active = brightness at dim_low): clock page only
          if ((id(backlight_pct).state <= ${dim_low}) && id(screen_page) != 3) {
            id(screen_page) = 3;
            id(rotate_counter) = 0;
          }
          static uint32_t last = 0;
          uint32_t now = millis();
          uint32_t period = (id(screen_page) == 3 || id(screen_page) == 9) ? 250 : 500;
          if (now - last >= period) {
            last = now;
            id(main_display).update();
          }

  # Hold detection: after long_press_ms the page button of the current page goes active
  # (clock page: toggles the dimmer = night mode, only the clock is shown while dimmed;
  #  WiFi page: toggles the QR code)
  - interval: 50ms
    then:
      - lambda: |-
          if (!id(touch_button).state || id(push_long))
            return;
          if (millis() - id(push_ts) < ${long_press_ms})
            return;
          id(push_long) = true;
          id(rotate_counter) = 0;
          if (id(screen_page) == 5)
            id(push_light).publish_state(true);
          if (id(screen_page) == 6) {
            id(wifi_qr_show) = !id(wifi_qr_show);
            id(wifi_qr_ms) = millis();
          }
          if (id(screen_page) == 3) {
            // dimmed -> back to the brightness from before, otherwise remember it and dim
            float cur = id(backlight_pct).state;
            float target;
            if (cur > ${dim_low}) {
              id(dim_prev) = cur;
              target = ${dim_low};
            } else {
              target = id(dim_prev) > ${dim_low} ? id(dim_prev) : 50.0f;
            }
            auto call = id(backlight_pct).make_call();
            call.set_value(target);
            call.perform();
          }

  # WiFi monitor: RSSI sample for the graph (-127 = not connected)
  - interval: 2s
    then:
      - lambda: |-
          int r = wifi::global_wifi_component->wifi_rssi();
          id(w_rssi_hist).push_back(r > -120 && r < 0 ? (float) r : NAN);
          if (id(w_rssi_hist).size() > 60)
            id(w_rssi_hist).erase(id(w_rssi_hist).begin());

  # Tea timer: end detection, jump to the timer page and ring
  - interval: 250ms
    then:
      - lambda: |-
          if (id(timer_state) == 1 && (int32_t) (id(timer_end_ms) - millis()) <= 0) {
            id(timer_state) = 3;
            id(screen_page) = 9;
            id(rotate_counter) = 0;
          }

  # Weather refresh
  - interval: 15min
    then:
      - script.execute: weather_update

  # Automatic page rotation (enabled pages + RotatePages list, see page_step)
  - interval: 1s
    then:
      - if:
          condition:
            lambda: 'return id(rotate_seconds).state >= 1 && id(timer_state) != 3 && !(id(backlight_pct).state <= ${dim_low});'
          then:
            - lambda: |-
                id(rotate_counter)++;
                if (id(rotate_counter) >= (int) id(rotate_seconds).state) {
                  id(rotate_counter) = 0;
                  id(page_step).execute(true);
                }

# ST7789 display
display:
  - platform: mipi_spi
    id: main_display
    model: ST7789V
    cs_pin: GPIO15
    dc_pin: GPIO2
    dimensions:
      width: 240
      height: 240
      offset_width: 0
      offset_height: 0
    rotation: 0
    data_rate: 40MHz  # default is 10 MHz; if the picture glitches try 20MHz
    update_interval: never  # refresh is triggered by the interval below (clock page faster)
    lambda: |-
      it.fill(Color(0, 0, 0));

      // QR code view only on the WiFi page and only for qr_show_s seconds
      if (id(screen_page) != 6 || (id(wifi_qr_show) && millis() - id(wifi_qr_ms) > ${qr_show_s} * 1000UL))
        id(wifi_qr_show) = false;

      // The fonts have no glyphs for non-ASCII characters (e.g. emoji in the SSID) and the missing
      // codepoint would spam the log: replace each multi-byte character with "_" and cut to maxlen
      auto clean_ascii = [](std::string value, size_t maxlen) {
        std::string clean;
        for (size_t i = 0; i < value.size(); i++) {
          unsigned char ch = value[i];
          if (ch < 0x80) {
            clean += (char) ch;
          } else {
            clean += '_';
            while (i + 1 < value.size() && ((unsigned char) value[i + 1] & 0xC0) == 0x80)
              i++;
          }
        }
        if (clean.length() > maxlen)
          clean.resize(maxlen);
        return clean;
      };

      // Language of the Language select: tr("english", "deutsch") for plain texts,
      // `de ? "..." : "..."` where the text is a printf format
      bool de = id(clock_lang).active_index().value_or(0) == 1;
      auto tr = [de](const char *en, const char *dg) { return de ? dg : en; };

      // BOOT / OTA NOTICE (shown before safe mode restart and during OTA)
      if (id(boot_notice) != 0) {
        it.rectangle(4, 4, 232, 232,
                     Color(255, 160, 0));

        if (id(boot_notice) == 1) {
          it.print(120, 30, id(value_font),
                   Color(255, 160, 0),
                   TextAlign::TOP_CENTER, tr("BOOTMODE", "BOOTMODUS"));

          it.print(120, 80, id(terminal_font),
                   Color(255, 160, 0),
                   TextAlign::TOP_CENTER, "SAFE MODE");

          it.line(15, 105, 225, 105, Color(120, 80, 0));

          it.print(120, 120, id(terminal_font),
                   Color(255, 200, 80),
                   TextAlign::TOP_CENTER, tr("WIFI + OTA ONLY", "NUR WLAN + OTA"));

          it.print(120, 142, id(terminal_font),
                   Color(255, 200, 80),
                   TextAlign::TOP_CENTER, tr("DISPLAY STAYS FROZEN", "DISPLAY BLEIBT STEHEN"));

          it.print(120, 175, id(terminal_font),
                   Color(255, 200, 80),
                   TextAlign::TOP_CENTER, tr("FLASH NEW FIRMWARE", "NEUE FIRMWARE FLASHEN"));

          it.print(120, 197, id(terminal_font),
                   Color(255, 200, 80),
                   TextAlign::TOP_CENTER, tr("OR WAIT FOR REBOOT", "ODER AUF NEUSTART WARTEN"));
        } else {
          it.print(120, 30, id(value_font),
