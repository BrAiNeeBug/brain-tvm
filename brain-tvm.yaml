                     Color(0, 180, 70));

        it.filled_rectangle(5, 5, 230, 28,
                            Color(0, 65, 30));

        it.printf(10, 11, id(terminal_font),
                  Color(0, 255, 90), "%s",
                  id(card_title).c_str());

        if (id(card_received)) {
          // line heights per size code: s, m, l, xl
          static const int heights[4] = {18, 26, 36, 46};
          const int gap = 6;
          int n = id(card_lines).size();

          // total height for vertical centering in the area below the header
          int total = 0;
          for (int i = 0; i < n; i++)
            total += heights[id(card_sizes)[i]] + (i > 0 ? gap : 0);
          int y = 34 + (194 - total) / 2;
          if (y < 36)
            y = 36;

          for (int i = 0; i < n; i++) {
            int code = id(card_sizes)[i];
            int h = heights[code];
            if (y + h > 230)
              break;

            if (i > 0) {
              it.line(15, y - gap / 2, 225, y - gap / 2, Color(0, 100, 40));
            }

            auto *font = id(terminal_font);
            if (code == 1) font = id(medium_font);
            else if (code == 2) font = id(value_font);
            else if (code == 3) font = id(clock_font);

            it.printf(120, y, font,
                      i == 0 ? Color(0, 255, 90) : Color(0, 200, 90),
                      TextAlign::TOP_CENTER, "%s",
                      id(card_lines)[i].c_str());

            y += h + gap;
          }
        } else {
          it.print(12, 75, id(terminal_font),
                   Color(0, 255, 90), tr("WAITING FOR DATA", "WARTE AUF DATEN"));

          it.print(12, 105, id(terminal_font),
                   Color(0, 180, 70), tr("Card text entity", "Card-Textfeld"));
        }
      }

      // PAGE 3: CLOCK
      else if (id(screen_page) == 3) {
        auto now = id(sntp_time).now();

        if (now.is_valid()) {
          // ---------- helpers ----------
          auto mix = [](Color a, Color b, float t) -> Color {
            return Color((uint8_t) (a.r + (b.r - a.r) * t),
                         (uint8_t) (a.g + (b.g - a.g) * t),
                         (uint8_t) (a.b + (b.b - a.b) * t));
          };
          auto dim = [](Color c, float f) -> Color {
            return Color((uint8_t) (c.r * f), (uint8_t) (c.g * f), (uint8_t) (c.b * f));
          };
          // rainbow: hue 0..360 -> full-saturation color
          auto hue = [](float h) -> Color {
            float x = fmodf(h, 360.0f) / 60.0f;
            int i = (int) x;
            float f = x - i;
            uint8_t up = (uint8_t) (255 * f);
            uint8_t down = (uint8_t) (255 * (1.0f - f));
            switch (i) {
              case 0: return Color(255, up, 0);
              case 1: return Color(down, 255, 0);
              case 2: return Color(0, 255, up);
              case 3: return Color(0, down, 255);
              case 4: return Color(up, 0, 255);
              default: return Color(255, 0, down);
            }
          };
          float hf = now.hour + now.minute / 60.0f + now.second / 3600.0f;

          // ---------- shared palette for digits + day bar ----------
          // u = 0..1; day: green -> blue -> purple, night: dark red; ClockBarHue slider shifts the hue
          float hoff = id(clock_bar_hue).state;
          float night;  // 0 = day, 1 = night, smooth fade 20-22 h and 5-7 h
          if (hf < 5.0f) night = 1.0f;
          else if (hf < 7.0f) night = 1.0f - (hf - 5.0f) / 2.0f;
          else if (hf < 20.0f) night = 0.0f;
          else if (hf < 22.0f) night = (hf - 20.0f) / 2.0f;
          else night = 1.0f;
          // nb = brightness of the night palette: digits full (readable at night), bar dimmed
          auto palette = [&](float u, float nb) -> Color {
            Color dayc = hue(140.0f + 150.0f * u + hoff);
            Color nightc = dim(hue(345.0f + 35.0f * u + hoff), nb);
            return mix(dayc, nightc, night);
          };

          // ---------- seconds ring: rainbow dots, bright comet follows the current second ----------
          const float rm = 6.0f, rl = 228.0f;
          for (int i = 0; i < 60; i++) {
            float s = fmodf(0.5f + i / 15.0f, 4.0f);  // 0 s = top center, clockwise
            int side = (int) s;
            float f = s - side;
            float px, py;
            switch (side) {
              case 0: px = rm + f * rl; py = rm; break;
              case 1: px = rm + rl; py = rm + f * rl; break;
              case 2: px = rm + rl - f * rl; py = rm + rl; break;
              default: px = rm; py = rm + rl - f * rl; break;
            }
            int d = (now.second - i + 60) % 60;  // seconds behind the comet head
            Color c = hue(i * 6.0f);
            if (d == 0) {
              it.filled_rectangle((int) px - 5, (int) py - 5, 10, 10, Color(255, 255, 255));
            } else if (d < 15) {
              it.filled_rectangle((int) px - 3, (int) py - 3, 6, 6, dim(c, 1.0f - d / 15.0f * 0.75f));
            } else {
              it.filled_rectangle((int) px - 3, (int) py - 3, 6, 6, dim(c, 0.12f));
            }
          }

          // ---------- weekday (own color per day) ----------
          static const char *weekdays_de[] = {"", "Sonntag", "Montag", "Dienstag", "Mittwoch",
                                              "Donnerstag", "Freitag", "Samstag"};
          static const char *weekdays_en[] = {"", "Sunday", "Monday", "Tuesday", "Wednesday",
                                              "Thursday", "Friday", "Saturday"};
          static const uint8_t wr[] = {0, 255, 255, 255, 255, 80, 60, 170};
          static const uint8_t wg[] = {0, 70, 80, 160, 230, 255, 200, 110};
          static const uint8_t wb[] = {0, 200, 80, 40, 60, 120, 255, 255};
          int wd = now.day_of_week;
          // weekday + date are dimmer than the time so the digits stand out (also at night)
          Color day_col = dim(Color(wr[wd], wg[wd], wb[wd]), ${date_bright_pct} / 100.0f);
          it.printf(120, 36, id(value_font),
                    day_col,
                    TextAlign::TOP_CENTER, "%s",
                    de ? weekdays_de[wd] : weekdays_en[wd]);

          // ---------- time: vertical gradient from the shared palette ----------
          float ut = hf / 24.0f * 0.8f;  // position in the palette moves with the time of day
          Color top = palette(ut, 1.0f);
          Color bot = palette(ut + 0.2f, 1.0f);
          const int cw = 43;  // char width of the 72px mono font
          float ph = (millis() % 2000) / 2000.0f;
          float br = 0.15f + 0.85f * (0.5f - 0.5f * cosf(2.0f * M_PI * ph));  // colon fade 0.15 .. 1.0
          const int bands = 12, y0 = 72, bh = 8;
          for (int k = 0; k < bands; k++) {
            Color c = mix(top, bot, k / (float) (bands - 1));
            it.start_clipping(0, y0 + k * bh, 239, y0 + (k + 1) * bh - 1);
            it.strftime(120 - cw / 2, y0, id(clock_big_font), c,
                        TextAlign::TOP_RIGHT, "%H", now);
            it.print(120, y0, id(clock_big_font), dim(c, br),
                     TextAlign::TOP_CENTER, ":");
            it.strftime(120 + cw / 2, y0, id(clock_big_font), c,
                        TextAlign::TOP_LEFT, "%M", now);
            it.end_clipping();
          }

          // ---------- day progress bar (0-24 h) ----------
          const int bx = 22, bw = 98;  // 98 columns x 2 px
          int cur = (int) (hf / 24.0f * bw);
          for (int c = 0; c < bw; c++) {
            Color col = palette(c / (float) (bw - 1), 0.45f);
            it.filled_rectangle(bx + c * 2, 171, 2, 6, c <= cur ? col : dim(col, 0.15f));
          }
          it.filled_rectangle(bx + cur * 2 - 1, 168, 4, 12,
                              dim(Color(255, 255, 255), 1.0f - 0.6f * night));

          // ---------- date (same color as the weekday) ----------
          it.strftime(120, 186, id(value_font),
                      day_col,
                      TextAlign::TOP_CENTER, de ? "%d.%m.%Y" : "%b %d, %Y", now);
        } else {
          it.print(12, 75, id(terminal_font),
                   Color(0, 255, 90), de ? "WARTE AUF NTP..." : "WAITING FOR NTP...");
        }
      }

      // PAGE 4: BLE SCANNER
      else if (id(screen_page) == 4) {
        bool trk_alert = id(tracker_alert) > 0;
        it.rectangle(4, 4, 232, 232,
                     trk_alert ? Color(255, 80, 0) : Color(0, 180, 70));

        it.filled_rectangle(5, 5, 230, 28,
                            Color(0, 65, 30));

        it.print(10, 11, id(terminal_font),
                 Color(0, 255, 90), "BLE SCANNER");

        // Live counter
        it.printf(120, 70, id(clock_font),
                  Color(0, 255, 90),
                  TextAlign::TOP_CENTER, "%d",
                  id(ble_count));

        it.print(120, 125, id(terminal_font),
                 Color(0, 200, 90),
                 TextAlign::TOP_CENTER, tr("DEVICES (LAST ${ble_timeout_s}s)", "GERAETE (LETZTE ${ble_timeout_s}s)"));

        it.line(15, 165, 225, 165,
                Color(0, 100, 40));

        it.printf(120, 180, id(terminal_font),
                  Color(0, 180, 70),
                  TextAlign::TOP_CENTER, de ? "SPITZE: %d" : "PEAK: %d",
                  id(ble_peak));

        if (!id(ble_scan_switch).state) {
          it.print(120, 205, id(terminal_font),
                   Color(255, 160, 0),
                   TextAlign::TOP_CENTER, tr("SCANNER OFF", "SCANNER AUS"));
        } else {
          it.printf(120, 205, id(terminal_font),
                    trk_alert ? Color(255, 160, 0) : Color(0, 180, 70),
                    TextAlign::TOP_CENTER,
                    trk_alert ? "! TRACKER: %d !" : "TRACKER: %d",
                    id(tracker_count));
        }
      }

      // PAGE 5: LIGHT (static)
      else if (id(screen_page) == 5) {
        it.rectangle(4, 4, 232, 232,
                     Color(0, 180, 70));

        it.filled_rectangle(5, 5, 230, 28,
                            Color(0, 65, 30));

        it.print(10, 11, id(terminal_font),
                 Color(0, 255, 90), tr("LIGHT", "LICHT"));

        it.print(120, 75, id(clock_font),
                 Color(0, 255, 90),
                 TextAlign::TOP_CENTER, tr("LIGHT", "LICHT"));

        it.line(30, 135, 210, 135,
                Color(0, 100, 40));

        it.print(120, 150, id(medium_font),
                 Color(0, 200, 90),
                 TextAlign::TOP_CENTER, "* * *");

        it.print(120, 195, id(terminal_font),
                 Color(0, 180, 70),
                 TextAlign::TOP_CENTER, tr("HOLD = PUSH", "HALTEN = DRUECKEN"));
      }

      // PAGE 6: WIFI MONITOR (signal + graph), hold = QR code to join the network
      else if (id(screen_page) == 6) {
        it.rectangle(4, 4, 232, 232,
                     Color(0, 180, 70));

        it.filled_rectangle(5, 5, 230, 28,
                            Color(0, 65, 30));

        if (id(wifi_qr_show)) {
          it.print(10, 11, id(terminal_font),
                   Color(0, 255, 90), tr("SCAN TO JOIN", "QR-CODE"));
          it.print(230, 11, id(terminal_font),
                   Color(0, 200, 90), TextAlign::TOP_RIGHT, tr("HOLD = BACK", "HALTEN = ZURUECK"));

          // white box with 2 modules quiet zone, black modules (phones need dark on light)
          int n = id(wifi_qr)->get_size();
          int scale = 190 / (n + 4);
          if (scale < 1)
            scale = 1;
          int box = (n + 4) * scale;
          int bx = (240 - box) / 2;
          int by = 34 + (198 - box) / 2;
          it.filled_rectangle(bx, by, box, box, Color(255, 255, 255));
          it.qr_code(bx + 2 * scale, by + 2 * scale, id(wifi_qr), Color(0, 0, 0), scale);
        } else {
          it.print(10, 11, id(terminal_font),
                   Color(0, 255, 90), tr("WIFI MONITOR", "WLAN-MONITOR"));
          it.print(230, 11, id(terminal_font),
                   Color(0, 200, 90), TextAlign::TOP_RIGHT, tr("HOLD = QR", "HALTEN = QR"));

          // green >= -60 dBm, yellow >= -70 dBm, red below
          auto sig_col = [](float v) {
            return v >= -60 ? Color(0, 255, 90) : (v >= -70 ? Color(255, 200, 0) : Color(255, 70, 60));
          };

          const std::vector<float> &h = id(w_rssi_hist);
          float rssi = h.empty() ? NAN : h.back();
          Color sc = std::isnan(rssi) ? Color(120, 120, 120) : sig_col(rssi);

          // ---------- current value + quality bar ----------
          float q = 0;
          if (!std::isnan(rssi)) {
            q = 2.0f * (rssi + 100.0f);
            if (q < 0) q = 0;
            if (q > 100) q = 100;
            it.printf(12, 40, id(value_font), sc, "%.0f dBm", rssi);
            it.printf(228, 40, id(value_font), sc, TextAlign::TOP_RIGHT, "%.0f%%", q);
          } else {
            it.print(12, 40, id(value_font), sc, "-- dBm");
          }
          it.rectangle(12, 76, 216, 8, Color(0, 100, 40));
          it.filled_rectangle(12, 76, (int) (q * 2.16f), 8, sc);

          // ---------- graph: last 2 minutes, -40 (top) .. -100 dBm (bottom) ----------
          const int gx = 42, gy = 90, gw = 180, gh = 72;
          it.rectangle(gx - 1, gy - 1, gw + 2, gh + 2, Color(0, 100, 40));
          auto ypos = [&](float v) {
            if (v > -40) v = -40;
            if (v < -100) v = -100;
            return gy + (int) ((-40 - v) * gh / 60.0f);
          };
          for (int g = -50; g >= -90; g -= 20) {
            it.line(gx, ypos(g), gx + gw - 1, ypos(g), Color(0, 55, 25));
            it.printf(gx - 4, ypos(g) - 7, id(terminal_font), Color(0, 140, 60),
                      TextAlign::TOP_RIGHT, "%d", g);
          }
          int n = h.size();
          for (int i = 1; i < n; i++) {
            if (std::isnan(h[i]) || std::isnan(h[i - 1]))
              continue;
            int x1 = gx + (60 - n + i - 1) * 3;
            it.line(x1, ypos(h[i - 1]), x1 + 3, ypos(h[i]), sig_col(h[i]));
            it.line(x1, ypos(h[i - 1]) + 1, x1 + 3, ypos(h[i]) + 1, sig_col(h[i]));
          }

          // ---------- min / avg / max of the graph window ----------
          float mn = 0, mx = 0, sum = 0;
          int cnt = 0;
          for (float v : h) {
            if (std::isnan(v))
              continue;
            if (cnt == 0 || v < mn) mn = v;
            if (cnt == 0 || v > mx) mx = v;
            sum += v;
            cnt++;
          }
          if (cnt > 0)
            it.printf(120, 166, id(terminal_font), Color(0, 200, 90), TextAlign::TOP_CENTER,
                      de ? "MIN %.0f MIT %.0f MAX %.0f" : "MIN %.0f AVG %.0f MAX %.0f", mn, sum / cnt, mx);

          // ---------- network info ----------
          auto info = [&](int y, const char *label, std::string v) {
            it.print(12, y, id(terminal_font), Color(0, 180, 70), label);
            it.print(60, y, id(terminal_font), Color(0, 255, 90), clean_ascii(v, 20).c_str());
          };
          info(184, "SSID", id(wifi_ssid_text).state);
          info(200, "AP", id(wifi_bssid_text).state);
          char cb[40];
          snprintf(cb, sizeof(cb), "%d / %s", (int) wifi::global_wifi_component->get_wifi_channel(),
                   id(wifi_ip).state.c_str());
          info(216, "CH/IP", cb);
        }
      }

      // PAGE 7: WEATHER (indoor/outdoor from HA, conditions + forecast from Open-Meteo)
      else if (id(screen_page) == 7) {
        it.rectangle(4, 4, 232, 232,
                     Color(0, 180, 70));

        it.filled_rectangle(5, 5, 230, 28,
                            Color(0, 65, 30));

        it.print(10, 11, id(terminal_font),
                 Color(0, 255, 90), tr("WEATHER", "WETTER"));

        std::string place = id(w_city).empty() ? id(weather_plz).state : id(w_city);
        if (place.length() > 12)
          place.resize(12);
        it.printf(230, 11, id(terminal_font),
                  Color(0, 200, 90),
                  TextAlign::TOP_RIGHT, "%s", place.c_str());

        // ---------- indoor / outdoor (outdoor falls back to the internet value when nothing fresh was sent) ----------
        uint32_t tmo = ${temp_timeout_min} * 60000UL;
        float t_in = (id(t_in_ms) != 0 && millis() - id(t_in_ms) < tmo) ? id(temp_indoor).state : NAN;
        float t_out = (id(t_out_ms) != 0 && millis() - id(t_out_ms) < tmo) ? id(temp_outdoor).state : NAN;
        if (std::isnan(t_out) && id(w_valid))
          t_out = id(w_temp);
        auto temp = [&](int x, const char *label, float t, Color c) {
          it.print(x, 40, id(terminal_font), Color(0, 180, 70),
                   TextAlign::TOP_CENTER, label);
          if (std::isnan(t))
            it.print(x, 60, id(value_font), c, TextAlign::TOP_CENTER, "--");
          else
            it.printf(x, 60, id(value_font), c, TextAlign::TOP_CENTER, "%.1f°", t);
        };
        temp(62, tr("INDOOR", "INNEN"), t_in, Color(255, 180, 60));
        temp(178, tr("OUTDOOR", "AUSSEN"), t_out, Color(90, 200, 255));
        it.line(120, 42, 120, 96, Color(0, 100, 40));
        it.line(15, 100, 225, 100, Color(0, 100, 40));

        if (id(w_valid) && id(w_dcode).size() >= 1) {
          // ---------- icon helpers ----------
          auto sun = [&](int x, int y, int r) {
            it.filled_circle(x, y, r, Color(255, 200, 0));
            for (int a = 0; a < 8; a++) {
              float an = a * M_PI / 4.0f;
              it.line(x + cosf(an) * (r + 2), y + sinf(an) * (r + 2),
                      x + cosf(an) * (r + 5), y + sinf(an) * (r + 5), Color(255, 200, 0));
            }
          };
          auto cloud = [&](int x, int y, int u, Color c) {
            it.filled_circle(x - u * 7 / 10, y + u / 5, u * 6 / 10, c);
            it.filled_circle(x, y - u / 5, u * 8 / 10, c);
            it.filled_circle(x + u * 8 / 10, y + u / 5, u * 6 / 10, c);
            it.filled_rectangle(x - u * 7 / 10, y + u / 5, u * 15 / 10, u * 6 / 10, c);
          };
          // c = WMO weather code from Open-Meteo
          auto icon = [&](int x, int y, int u, int c) {
            Color grey(170, 180, 200), dark(120, 130, 150);
            if (c <= 2) {
              if (c == 0) {
                sun(x, y, u * 6 / 10);
              } else {
                sun(x + u * 4 / 10, y - u * 4 / 10, u * 5 / 10);
                cloud(x - u * 2 / 10, y + u * 3 / 10, u * 7 / 10, grey);
              }
            } else if (c == 45 || c == 48) {
              for (int k = -1; k <= 1; k++)
                it.line(x - u, y + k * u / 2, x + u, y + k * u / 2, grey);
            } else if ((c >= 51 && c <= 67) || (c >= 80 && c <= 82)) {
              cloud(x, y - u / 4, u * 9 / 10, dark);
              for (int k = -1; k <= 1; k++)
                it.line(x + k * u / 2, y + u * 6 / 10, x + k * u / 2 - 2, y + u * 11 / 10,
                        Color(60, 150, 255));
            } else if ((c >= 71 && c <= 77) || c == 85 || c == 86) {
              cloud(x, y - u / 4, u * 9 / 10, grey);
              for (int k = -1; k <= 1; k++)
                it.filled_circle(x + k * u / 2, y + u * 9 / 10, u / 8 + 1, Color(240, 245, 255));
            } else if (c >= 95) {
              cloud(x, y - u / 4, u * 9 / 10, dark);
              it.line(x + u / 5, y + u * 5 / 10, x - u / 5, y + u * 8 / 10, Color(255, 220, 0));
              it.line(x - u / 5, y + u * 8 / 10, x + u / 5, y + u * 12 / 10, Color(255, 220, 0));
            } else {
              cloud(x, y, u, grey);
            }
          };
          auto cond = [de](int c) -> const char * {
            if (c == 0) return de ? "Klar" : "Clear";
            if (c <= 2) return de ? "Teils wolkig" : "Part cloudy";
            if (c == 3) return de ? "Bedeckt" : "Cloudy";
            if (c == 45 || c == 48) return de ? "Nebel" : "Fog";
            if (c >= 51 && c <= 57) return de ? "Nieselregen" : "Drizzle";
            if (c >= 61 && c <= 67) return de ? "Regen" : "Rain";
            if (c >= 71 && c <= 77) return de ? "Schnee" : "Snow";
            if (c >= 80 && c <= 82) return de ? "Schauer" : "Showers";
            if (c == 85 || c == 86) return de ? "Schneefall" : "Snow showers";
            if (c >= 95) return de ? "Gewitter" : "Thunder";
            return de ? "Bedeckt" : "Cloudy";
          };

          // ---------- now + today high/low ----------
          icon(40, 132, 16, id(w_code));
          it.print(78, 110, id(medium_font), Color(0, 255, 90),
                   TextAlign::TOP_LEFT, cond(id(w_code)));
          it.printf(78, 136, id(terminal_font), Color(0, 200, 90),
                    TextAlign::TOP_LEFT, de ? "Hoch %.0f°  Tief %.0f°" : "H %.0f°  L %.0f°",
                    id(w_dmax)[0], id(w_dmin)[0]);
          it.line(15, 162, 225, 162, Color(0, 100, 40));

          // ---------- next 3 days ----------
          static const char *wd3_en[] = {"Sun", "Mon", "Tue", "Wed", "Thu", "Fri", "Sat"};
          static const char *wd3_de[] = {"So", "Mo", "Di", "Mi", "Do", "Fr", "Sa"};
          auto now = id(sntp_time).now();
          int wd0 = now.is_valid() ? now.day_of_week - 1 : 0;
          for (int i = 1; i <= 3 && i < (int) id(w_dcode).size(); i++) {
            int cx = 40 + (i - 1) * 80;
            it.printf(cx, 168, id(terminal_font), Color(0, 200, 90),
                      TextAlign::TOP_CENTER, "%s", (de ? wd3_de : wd3_en)[(wd0 + i) % 7]);
            icon(cx, 196, 9, id(w_dcode)[i]);
            it.printf(cx, 212, id(terminal_font), Color(0, 255, 90),
                      TextAlign::TOP_CENTER, "%.0f/%.0f°", id(w_dmax)[i], id(w_dmin)[i]);
          }
        } else {
          it.print(120, 110, id(terminal_font), Color(0, 255, 90),
                   TextAlign::TOP_CENTER, tr("NO DATA", "KEINE DATEN"));
          it.printf(120, 135, id(terminal_font), Color(0, 200, 90),
                    TextAlign::TOP_CENTER, "%s",
                    id(w_status).empty() ? tr("NO UPDATE YET", "NOCH KEIN UPDATE") : id(w_status).c_str());
        }
      }

      // PAGE 8: MOON PHASE (calculated from the date, no internet needed)
      else if (id(screen_page) == 8) {
        it.rectangle(4, 4, 232, 232,
                     Color(0, 180, 70));

        it.filled_rectangle(5, 5, 230, 28,
                            Color(0, 65, 30));

        it.print(10, 11, id(terminal_font),
                 Color(0, 255, 90), tr("MOON PHASE", "MONDPHASE"));

        auto now = id(sntp_time).now();
        if (!now.is_valid()) {
          it.print(120, 120, id(terminal_font), Color(0, 255, 90),
                   TextAlign::TOP_CENTER, tr("NO TIME", "KEINE UHRZEIT"));
        } else {
          // days since the new moon of 2000-01-06 18:14 UTC, mean synodic month (good to about half a day)
          const float syn = 29.530588853f;
          double cyc = ((double) now.timestamp - 947182440.0) / 86400.0 / syn;
          float p = (float) (cyc - floor(cyc));  // 0 = new, 0.5 = full
          float k = cosf(2.0f * M_PI * p);

          // disc: dark base, lit part per scanline (waxing = lit on the right)
          const int cx = 120, cy = 92, r = 54;
          for (int dy = -r; dy <= r; dy++) {
            int w = (int) sqrtf((float) (r * r - dy * dy));
            int xt = (int) (k * w);
            int a = p < 0.5f ? xt : -w;
            int b = p < 0.5f ? w : -xt;
            it.line(cx - w, cy + dy, cx + w, cy + dy, Color(35, 38, 50));
            if (b > a)
              it.line(cx + a, cy + dy, cx + b, cy + dy, Color(238, 235, 205));
          }
          it.circle(cx, cy, r, Color(90, 95, 115));

          const char *name = tr("New Moon", "Neumond");
          if (p >= 0.97f)      name = tr("New Moon", "Neumond");
          else if (p >= 0.78f) name = tr("Waning Crescent", "Abnehmende Sichel");
          else if (p >= 0.72f) name = tr("Last Quarter", "Letztes Viertel");
          else if (p >= 0.53f) name = tr("Waning Gibbous", "Abnehmender Mond");
          else if (p >= 0.47f) name = tr("Full Moon", "Vollmond");
          else if (p >= 0.28f) name = tr("Waxing Gibbous", "Zunehmender Mond");
          else if (p >= 0.22f) name = tr("First Quarter", "Erstes Viertel");
          else if (p >= 0.03f) name = tr("Waxing Crescent", "Zunehmende Sichel");
          it.print(120, 156, id(medium_font), Color(0, 255, 90),
                   TextAlign::TOP_CENTER, name);

          float to_full = (p < 0.5f ? 0.5f - p : 1.5f - p) * syn;
          float to_new = (1.0f - p) * syn;
          it.printf(120, 186, id(terminal_font), Color(0, 200, 90),
                    TextAlign::TOP_CENTER, de ? "HELL %.0f%%   ALTER %.1f T" : "LIT %.0f%%   AGE %.1f d", (1.0f - k) * 50.0f, p * syn);
          it.printf(120, 204, id(terminal_font), Color(0, 200, 90),
                    TextAlign::TOP_CENTER, de ? "VOLL %.0f T   NEU %.0f T" : "FULL %.0f d   NEW %.0f d", to_full, to_new);
        }
      }

      // PAGE 9: TEA TIMER (touch: hold = +step, longer = start/pause, longest = reset)
      else if (id(screen_page) == 9) {
        uint32_t nowm = millis();
        int st = id(timer_state);

        if (st == 3) {
          // alarm: flashing until touched
          bool blink = (nowm / 500) % 2;
          Color bg = blink ? Color(0, 200, 80) : Color(0, 0, 0);
          Color fg = blink ? Color(0, 0, 0) : Color(0, 255, 90);
          it.filled_rectangle(0, 0, 240, 240, bg);
          it.print(120, 85, id(value_font), fg, TextAlign::TOP_CENTER, tr("TEA READY!", "TEE FERTIG!"));
          it.print(120, 130, id(terminal_font), fg, TextAlign::TOP_CENTER, tr("TOUCH = OK", "BERUEHREN = OK"));
        } else {
          it.rectangle(4, 4, 232, 232,
                       Color(0, 180, 70));

          it.filled_rectangle(5, 5, 230, 28,
                              Color(0, 65, 30));

          it.print(10, 11, id(terminal_font),
                   Color(0, 255, 90), tr("TEA TIMER", "TEE-TIMER"));
          it.print(230, 11, id(terminal_font),
                   Color(0, 200, 90), TextAlign::TOP_RIGHT,
                   st == 1 ? tr("RUNNING", "LAEUFT") : (st == 2 ? tr("PAUSED", "PAUSE") : tr("READY", "BEREIT")));

          int32_t rem;
          if (st == 1)
            rem = (int32_t) (id(timer_end_ms) - nowm);
          else if (st == 2)
            rem = (int32_t) id(timer_rem_ms);
          else
            rem = id(timer_set_s) * 1000;
          if (rem < 0)
            rem = 0;
          int secs = (rem + 999) / 1000;
          Color tc = st == 1 ? Color(0, 255, 90) : (st == 2 ? Color(255, 200, 0) : Color(90, 200, 255));
          it.printf(120, 36, id(clock_big_font), tc, TextAlign::TOP_CENTER,
                    "%02d:%02d", secs / 60, secs % 60);

          // progress bar (full = whole time left)
          float frac = (st == 0 || id(timer_total_ms) == 0) ? 1.0f : rem / (float) id(timer_total_ms);
          if (frac > 1.0f)
            frac = 1.0f;
          it.rectangle(12, 128, 216, 8, Color(0, 100, 40));
          it.filled_rectangle(12, 128, (int) (frac * 216), 8, tc);

          // legend, the stage reached by the current hold is highlighted
          uint32_t held = id(touch_button).state ? nowm - id(push_ts) : 0;
          int stage = held >= ${timer_reset_ms} ? 3 : (held >= ${timer_start_ms} ? 2 : (held >= ${long_press_ms} ? 1 : 0));
          auto leg = [&](int y, int s, const char *txt) {
            if (stage == s)
              it.filled_rectangle(12, y - 2, 216, 18, Color(0, 65, 30));
            it.print(120, y, id(terminal_font), stage == s ? Color(0, 255, 90) : Color(0, 120, 50),
                     TextAlign::TOP_CENTER, txt);
          };
          leg(146, 1, tr("HOLD: +${timer_step_s}s", "HALTEN: +${timer_step_s}s"));
          leg(166, 2, st == 1 ? tr("LONGER: PAUSE", "LAENGER: PAUSE") : tr("LONGER: START", "LAENGER: START"));
          leg(186, 3, tr("LONGEST: RESET", "AM LAENGSTEN: RESET"));
          it.print(120, 210, id(terminal_font), Color(0, 100, 40),
                   TextAlign::TOP_CENTER, tr("TAP = NEXT PAGE", "TIPPEN = WEITER"));
        }
      }
    invert_colors: true
